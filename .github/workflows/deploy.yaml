name: Deploy to Vercel

# Production deploys on every push to main. Pull requests from branches in this
# repository get a preview deploy; pull requests from forks are skipped because
# they must never receive VERCEL_TOKEN.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a production deploy half-way; previews can be superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # preview URL comment
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Pinned so a new CLI release cannot change deploys without a reviewed PR.
      VERCEL_CLI_VERSION: "67.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Set deployment flags
        id: flags
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="${{ steps.flags.outputs.environment }}" --token="$VERCEL_TOKEN"

      - name: Build project
        run: vercel build ${{ steps.flags.outputs.prod_flag }} --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --archive=tgz ${{ steps.flags.outputs.prod_flag }} --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployed: ${process.env.PREVIEW_URL}`
            });
