name: Generate OG Images

on:
  pull_request:
    branches:
      - main
    paths:
      - 'content/blog/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  og-images:
    # Only for branches in this repository: a fork's branch can't be pushed to
    # with this repository's token, and fork code must not get write access.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push generated images back to the PR branch
    env:
      HEAD_REF: ${{ github.head_ref }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate missing OG images
        run: npm run generate:og
        continue-on-error: true

      # Commits made with GITHUB_TOKEN don't start new workflow runs, so after
      # this pushes, re-run CI on the PR (or push any commit) before merging.
      - name: Commit OG images to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og/*.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: add missing OG images"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          else
            echo "No new OG images to commit"
          fi
