name: Generate OG Images

on:
  pull_request:
    branches:
      - main
    paths:
      - 'content/blog/**'

jobs:
  og-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push generated images back to the PR branch

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate missing OG images
        run: npm run generate:og
        continue-on-error: true

      - name: Commit OG images to PR branch
        run: |
          git config user.email "dharmendra@jagodana.org"
          git config user.name "dharmendra-jagodana"
          git add public/og/*.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: add missing OG images"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "No new OG images to commit"
          fi
